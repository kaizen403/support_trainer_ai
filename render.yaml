services:
  - type: web
    name: fe
    runtime: node
    buildCommand: pnpm --filter fe build
    startCommand: pnpm --filter fe start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: http
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: ws
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_LIVEKIT_URL
        sync: false

  - type: web
    name: http
    runtime: node
    buildCommand: pnpm --filter @acme/http build
    startCommand: pnpm --filter @acme/http start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: http
          envVarKey: RENDER_EXTERNAL_URL
      - key: PORT_HTTP
        value: "10000"
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVEN_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: http
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: ws
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_LIVEKIT_URL
        sync: false

  - type: web
    name: ws
    runtime: node
    buildCommand: pnpm --filter @acme/ws build
    startCommand: pnpm --filter @acme/ws start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: PORT_WS
        value: "10000"

  - type: worker
    name: agent
    runtime: node
    buildCommand: pnpm --filter agent build
    startCommand: pnpm --filter agent start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: http
          envVarKey: RENDER_EXTERNAL_URL
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVEN_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: http
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: ws
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_LIVEKIT_URL
        sync: false

databases:
  - name: db
    databaseName: callcenter
    postgresMajorVersion: "15"
